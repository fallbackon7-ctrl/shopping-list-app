
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shopping List</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My Shopping List</h1>
    <p>Add your items, track their prices, and check them off as you shop.</p>

    <form id="item-form">
      <input id="item-name" type="text" placeholder="Item name" required>
      <input id="item-price" type="number" min="0" step="0.01"
             placeholder="Price (KSh)" required>
      <button type="submit">Add Item</button>
    </form>

    <ul id="shopping-list"></ul>

    <section class="summary">
      <p>Total cost: <strong id="total-cost">KSh 0.00</strong></p>
      <p>Purchased: <strong id="purchased-count">0</strong></p>
    </section>

    <button id="mark-purchased" type="button">Mark Selected Purchased</button>
    <button id="clear-list" type="button">Clear List</button>
  </main>
</body>
</html>
